name: Build

on:
  # Fork pull_request tokens are read-only, even after merge.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BUILD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
    outputs:
      sha: ${{ env.BUILD_SHA }}
      version: ${{ steps.version.outputs.version }}
      godot: ${{ steps.toolchain.outputs.godot }}
      android_release: ${{ steps.android.outputs.release }}
    defaults:
      run:
        shell: pwsh
    steps:
      # tools/build.ps1 verifies the music generator's SHA-256 against a hash of the CRLF working copy.
      - name: Use CRLF checkout
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v7
        with:
          # On merge, fetch the base branch, never the PR head or a synthetic merge ref.
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          fetch-depth: ${{ github.event.pull_request.merged && '0' || '1' }}

      - name: Select merged commit from main history
        if: github.event_name == 'pull_request_target'
        run: |
          git merge-base --is-ancestor $env:BUILD_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw "Merge commit $env:BUILD_SHA is not in main history." }
          git switch --detach $env:BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not check out merge commit $env:BUILD_SHA." }

      - name: Read toolchain
        id: toolchain
        run: |
          $config = Get-Content tools/toolchain.json -Raw | ConvertFrom-Json
          "godot=$($config.godot)" >> $env:GITHUB_OUTPUT

      # Next version = game_version from toolchain.json, or one patch above the newest
      # existing vMAJOR.MINOR.x tag if that version has already been released.
      - name: Determine release version
        id: version
        run: |
          $base = [version](Get-Content tools/toolchain.json -Raw | ConvertFrom-Json).game_version
          $refs = git ls-remote --tags --refs origin 'v*'
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing tags.' }
          $released = @($refs | ForEach-Object { if ($_ -match 'refs/tags/v(\d+\.\d+\.\d+)$') { [version]$Matches[1] } } |
            Where-Object { $_.Major -eq $base.Major -and $_.Minor -eq $base.Minor } | Sort-Object -Descending)
          $next = if ($released.Count -and $released[0] -ge $base) { [version]::new($base.Major, $base.Minor, $released[0].Build + 1) } else { $base }
          Write-Host "Release version: $next"
          "version=$next" >> $env:GITHUB_OUTPUT

      - name: Cache Godot engine and export templates
        uses: actions/cache@v6
        with:
          path: |
            .tools/downloads
            .tools/templates
          key: godot-${{ steps.toolchain.outputs.godot }}-windows-android

      - name: Install Godot
        run: ./tools/bootstrap.ps1 -Platform All

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools and select signing mode
        id: android
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          . ./tools/android-apk.ps1
          $sdk = Get-AndroidSdk
          & "$sdk/cmdline-tools/latest/bin/sdkmanager.bat" 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android Build-Tools installation failed.' }
          $official = $env:HAS_KEY -eq 'true' -and $env:GITHUB_REF -eq 'refs/heads/main'
          "release=$($official.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $official) { Write-Host 'Building the Android preview. Official APK signing requires the release keystore on main.' }

      - name: Install Inno Setup
        id: inno
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Test, export and package
        run: |
          $official = '${{ steps.android.outputs.release }}' -eq 'true'
          ./tools/build.ps1 -Platform All -AndroidUnsigned:$official -AndroidPreview:(!$official) -Iscc '${{ steps.inno.outputs.iscc }}' -Version '${{ steps.version.outputs.version }}'

      - name: Sign and verify Android release
        if: steps.android.outputs.release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          . ./tools/android-apk.ps1
          $env:ANDROID_RELEASE_KEYSTORE = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString('N') + '.keystore')
          $base = "$pwd/releases/$env:VERSION/CosmicConflict-$env:VERSION-Android"
          try {
            [IO.File]::WriteAllBytes($env:ANDROID_RELEASE_KEYSTORE, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            Write-SignedApk (Get-AndroidSdk) "$base-unsigned.apk" "$base.apk"
            Remove-Item -LiteralPath "$base-unsigned.apk"
          } finally {
            if (Test-Path -LiteralPath $env:ANDROID_RELEASE_KEYSTORE) { Remove-Item -LiteralPath $env:ANDROID_RELEASE_KEYSTORE }
          }

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: CosmicConflict-${{ steps.version.outputs.version }}-Android-${{ env.BUILD_SHA }}
          path: releases/${{ steps.version.outputs.version }}/CosmicConflict-${{ steps.version.outputs.version }}-Android${{ steps.android.outputs.release != 'true' && '-preview' || '' }}.apk
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: CosmicConflict-${{ steps.version.outputs.version }}-Setup-${{ env.BUILD_SHA }}
          path: releases/${{ steps.version.outputs.version }}/CosmicConflict-${{ steps.version.outputs.version }}-Setup.exe
          if-no-files-found: error

      - name: Upload game files
        uses: actions/upload-artifact@v7
        with:
          name: CosmicConflict-${{ steps.version.outputs.version }}-app-${{ env.BUILD_SHA }}
          path: releases/${{ steps.version.outputs.version }}/app/
          if-no-files-found: error

  macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GODOT_RELEASE: ${{ needs.build.outputs.godot }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Cache verified Mac toolchain
        id: cache
        uses: actions/cache@v6
        with:
          path: .tools/mac
          key: godot-${{ needs.build.outputs.godot }}-mac-universal-v1

      - name: Install Godot and macOS export template
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/mac
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE"
          editor="Godot_v${GODOT_RELEASE}_macos.universal.zip"
          templates="Godot_v${GODOT_RELEASE}_export_templates.tpz"
          for file in SHA512-SUMS.txt "$editor" "$templates"; do
            curl -fsSL --retry 3 "$base/$file" -o "$file"
          done
          for file in "$editor" "$templates"; do
            awk -v f="$file" '$2 == f { print; found=1 } END { exit !found }' SHA512-SUMS.txt > check.sha512
            shasum -a 512 -c check.sha512
          done
          ditto -x -k "$editor" "$GITHUB_WORKSPACE/.tools/mac"
          unzip -p "$templates" templates/macos.zip > "$GITHUB_WORKSPACE/.tools/mac/macos.zip"

      - name: Export, verify and package universal app
        shell: bash
        run: bash tools/build-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: CosmicConflict-${{ env.VERSION }}-macOS-${{ needs.build.outputs.sha }}
          path: releases/${{ env.VERSION }}/CosmicConflict-${{ env.VERSION }}-macOS-universal.zip
          if-no-files-found: error

  release:
    needs: [build, macos]
    if: github.event.pull_request.merged == true || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BUILD_SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: CosmicConflict-${{ env.VERSION }}-Setup-${{ env.BUILD_SHA }}
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: CosmicConflict-${{ env.VERSION }}-app-${{ env.BUILD_SHA }}
          path: release/app
      - uses: actions/download-artifact@v7
        with:
          name: CosmicConflict-${{ env.VERSION }}-macOS-${{ env.BUILD_SHA }}
          path: release
      - uses: actions/download-artifact@v7
        if: needs.build.outputs.android_release == 'true'
        with:
          name: CosmicConflict-${{ env.VERSION }}-Android-${{ env.BUILD_SHA }}
          path: release
      - name: Create tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $folder = "release"
          $installer = "$folder/CosmicConflict-$env:VERSION-Setup.exe"
          $portable = "$folder/CosmicConflict-$env:VERSION-Windows-x64.zip"
          $mac = "$folder/CosmicConflict-$env:VERSION-macOS-universal.zip"
          $assets = @($installer, $portable, $mac)
          if ('${{ needs.build.outputs.android_release }}' -eq 'true') { $assets += "$folder/CosmicConflict-$env:VERSION-Android.apk" }
          Compress-Archive -Path "$folder/app/*" -DestinationPath $portable -Force
          $notes = @(
            '| File | SHA-256 |'
            '| --- | --- |'
            foreach ($file in $assets) { "| $(Split-Path $file -Leaf) | ``$((Get-FileHash $file -Algorithm SHA256).Hash)`` |" }
          ) -join "`n"
          gh release create "v$env:VERSION" @assets --target $env:BUILD_SHA --title "Cosmic Conflict $env:VERSION" --notes $notes --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
